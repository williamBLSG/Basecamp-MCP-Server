          - heading "World-class HIV care, now in Memphis too." [level=1] [ref=e43]
          - generic [ref=e44]:
            - paragraph [ref=e45]: We’re excited to introduce a new CARES 360 Community Clinic location at Friends For All in Memphis. Nashville CARES and Friends For All have enjoyed a close working relationship for nearly 40 years. We share the same mission, and embrace the same values. Now we’re teaming up to expand clinic capacity and access in response to growing needs.
            - generic [ref=e46]:
              - text: "Memphis patients and clients: our top priority is to ensure a smooth transition for you."
              - strong [ref=e47]: Your care team, case manager, appointments and prescriptions will all continue as scheduled.
            - generic [ref=e49]:
              - text: Remember,
              - strong [ref=e50]: please keep all scheduled appointments.
              - text: If you have questions about appointments or prescriptions, call 901-896-0739 during business hours. As always, we’re here for you.
