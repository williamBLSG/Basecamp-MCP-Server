        - generic [ref=e71]:
          - heading "From testing and prevention to psychiatry, weight management and more." [level=2] [ref=e72]
          - paragraph [ref=e74]: No matter who you are, your health needs will continue to evolve over time – that’s one part of the human experience we all share. CARES 360 provides safe, trusted access to the support you need along each step of your health journey.
          - link "View All Services" [ref=e76] [cursor=pointer]:
            - /url: /services
        - generic [ref=e80]:
          - generic [ref=e82]:
            - img "water drop with plus sign icon" [ref=e83]
            - heading "HIV Testing & Care" [level=3] [ref=e84]
            - generic [ref=e85]: We offer rapid HIV testing. Our goal is to initiate antiretroviral therapy within 72 hours of a positive test result.
          - generic [ref=e87]:
            - img "vial icon" [ref=e88]
            - heading "STD Testing & Care" [level=3] [ref=e89]
            - generic [ref=e90]: If you’re sexually active, regular testing can play an important role in keeping you healthy. We’re here to help.
          - generic [ref=e92]:
            - img "microscope icon" [ref=e93]
            - heading "Hepatitis C Testing & Care" [level=3] [ref=e94]
            - generic [ref=e95]: Many people infected with HEP C don’t actually feel or look sick. If you’ve shared or reused a syringe, get tested now.
          - generic [ref=e97]:
            - img "heart icon with heart beat" [ref=e98]
            - heading "Lifelong Wellness" [level=3] [ref=e99]
            - generic [ref=e100]: We welcome the LGBTQ+ community with open arms. But CARES 360 is for anyone seeking healthcare delivered with empathy and love.
      - generic [ref=e104]:
