          - generic [ref=f6e102]:
            - heading "Kassem Bourgi, M.D." [level=3] [ref=f6e103]
            - generic [ref=f6e104]: Medical Director
            - generic [ref=f6e105]: With an MD from the American University of Beirut and extensive training in Infectious Diseases from Vanderbilt University, Kassem has honed a patient-centric approach to healthcare, clinical research and medical education serving diverse populations. He is deeply committed to advancing HIV treatment and public health, and has directed multiple funded HIV research projects, including serving as a Primary Investigator for several industry-funded clinical trials. His expertise encompasses spearheading local, regional and national HIV educational initiatives, along with providing training and medical education for students, residents and fellows. Kassem has been invited to speak and share his research findings at several national and international HIV conferences.
            - link "LinkedIn" [ref=f6e107] [cursor=pointer]:
              - /url: https://www.linkedin.com/in/kassem-bourgi-804a17b9/
