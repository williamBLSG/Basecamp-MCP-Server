        - generic [ref=f6e110]:
          - generic [ref=f6e111]:
            - heading "Amna Osman, MPA" [level=3] [ref=f6e112]
            - generic [ref=f6e113]: Chief Executive Officer
            - generic [ref=f6e114]: Amna has 24 years of experience as a public health innovator and executive leader, with an extensive background in all aspects of leadership and management. Prior to her current role, she was President and CEO at HAVEN, a domestic and sexual violence nonprofit in the Greater Detroit Area. She is Founder and President of Osman Consulting in Grand Blanc, Michigan, where she provided leadership development both in the U.S. and overseas. Amna served as the Director of the Division of Health, Wellness, and Disease Control for Michigan Department of Community Health, where she oversaw the division which covers Health Disparities Reduction/Minority Health, Sexually Transmitted Diseases, HIV/AIDS Prevention Education, Care and Treatment, as well as the AIDS Drug Assistance Program and HIV/AIDS Oral Health Program.
            - link "LinkedIn" [ref=f6e116] [cursor=pointer]:
              - /url: https://www.linkedin.com/in/amna-osman-b64b1151/
          - img "Amna Osman headshot" [ref=f6e120]
        - generic [ref=f6e121]:
          - img "Daveisha Moore Eberhardt headshot" [ref=f6e124]
          - generic [ref=f6e125]:
            - heading "Daveisha Moore Eberhardt" [level=3] [ref=f6e126]
            - generic [ref=f6e127]: Medical Practice Manager - Nashville
            - generic [ref=f6e128]: Daveisha has spent 15+ years as a healthcare operations leader. She has a deep passion for improving patient outcomes, which she has accomplished by leading positive change, building high-performance teams, coaching healthcare leaders and generating results. She’s adept at shaping strategy and driving care delivery while driving growth, profitability and resolving complex challenges. Prior to joining CARES 360, Daveisha served as VP of Clinical Operations and then VP of Provider Operations at Peregrine Health. Before that, she was Regional Manager, State Policy and Advocacy for Susan G. Komen. She also served as a Legislative Assistant for the State of Tennessee, reporting to the House Health and Human Resources Committee Chairman and President-Elect of the National Black Caucus of States Legislatures.
            - link "LinkedIn" [ref=f6e130] [cursor=pointer]:
              - /url: https://www.linkedin.com/in/daveisha-moore-15640b49/
        - generic [ref=f6e131]:
          - generic [ref=f6e132]:
            - heading "Julia Watson" [level=3] [ref=f6e133]
            - generic [ref=f6e134]: Director of Practice Operations - Memphis
            - generic [ref=f6e136]:
              - paragraph [ref=f6e137]: Julia leads our Memphis clinic operations, and is responsible for strategic initiatives that strengthen access to high-quality care for underserved communities. She brings extensive experience in clinical administration, revenue cycle management and regulatory compliance.
              - paragraph [ref=f6e138]: Julia also has deep expertise in Ryan White program administration, 340B compliance and healthcare revenue cycle management. Throughout her career, she has led complex initiatives to maximize efficiency and accountability. She’s known for her strategic thinking, systems-oriented approach and strong investment in staff development.
              - paragraph [ref=f6e139]: Julia’s work is rooted in the belief that strong systems and supported teams are essential to delivering equitable, compassionate healthcare. She remains dedicated to strengthening infrastructure in ways that allow our clinic to serve communities with dignity, access and excellence.
