        - 'heading "CARES 360 Community Clinic: A natural evolution." [level=1] [ref=f6e41]': CARES 360 Community Clinic:A natural evolution.
        - generic [ref=f6e42]:
          - paragraph [ref=f6e43]: "In 1985, Nashville CARES began with a mission born out of urgency, compassion and grit: to care for our neighbors living with HIV, and to fight the surrounding stigma. Over the years, that mission has grown into a movement. We've evolved from crisis responders to leaders in public health, equity and innovation."
          - paragraph [ref=f6e44]: As the scope of our mission continued to expand, it became clear that this life-changing work would be even more effective if we could reimagine our clinic as a separate (but closely related) entity. By establishing CARES 360 as a full-service health equity provider, the CARES family is already setting a new standard for inclusive, community-based healthcare.
          - paragraph [ref=f6e45]: CARES 360 now provides dignity, acceptance and unwavering care from convenient locations in Nashville and Memphis. Our goal is continue expanding both clinic capacity and patient access in response to our state’s growing needs.
          - generic [ref=f6e46]: But this evolution isn’t just about us. It’s about everyone who believes that empathy-based healthcare is a right, not a privilege. It’s about building a Tennessee where no one slips through the cracks. Where dignity leads the way. Where whole-person care makes the whole community stronger.
          - paragraph [ref=f6e48]: It’s about you.
        - link "Contact Us" [ref=f6e50] [cursor=pointer]:
          - /url: https://nashvillecares.jotform.com/251754258816061
